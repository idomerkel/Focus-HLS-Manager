<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus HLS - Command Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --cyber-blue: #00b4d8; --dark-bg: #0b0f19; --panel-bg: #1a2235; --focus-orange: #f77f00; --alert-red: #d90429; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: #caf0f8; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 350px; background: var(--panel-bg); border-right: 2px solid var(--cyber-blue); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-logo-container { padding: 20px; text-align: center; background: #000; border-bottom: 2px solid var(--cyber-blue); }
        .sidebar-logo-container h1 { color: #fff; margin: 0; font-size: 32px; letter-spacing: 2px; }
        .sidebar-logo-container h1 span { color: var(--cyber-blue); }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; }

        .guard-group { margin-bottom: 12px; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        .guard-header { background: rgba(0, 180, 216, 0.1); padding: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #222; }
        .session-list { display: block; background: #000; } 
        .session-item { padding: 10px; border-bottom: 1px solid #222; font-size: 0.8em; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: #aaa; }
        .session-item:hover { color: var(--cyber-blue); background: #111; }
        .session-item.active { border-left: 4px solid var(--cyber-blue); color: #fff; background: #111; }
        .del-btn { color: var(--alert-red); font-weight: bold; border: none; background: none; cursor: pointer; padding: 5px; }

        .main-content { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* TELEMETRY */
        .telemetry-row { height: 15vh !important; min-height: 100px; max-height: 120px; background: #000; border: 1px solid var(--cyber-blue); margin-bottom: 15px; position: relative; }
        
        .timeline-container { height: 25vh; overflow-y: auto; background: #0a0e14; padding: 10px; border-radius: 6px; border: 1px solid #1a2235; margin-bottom: 15px; }
        .time-entry { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; border-bottom: 1px solid #1a2235; padding-bottom: 5px; font-size: 0.85em; }
        .status-tag { background: var(--cyber-blue); color: #000; padding: 2px 8px; border-radius: 3px; font-weight: bold; font-size: 0.7em; }

        .dashboard-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 15px; flex: 1; min-height: 0; }
        .card { background: var(--panel-bg); padding: 15px; border-radius: 8px; border: 1px solid #1a2235; overflow-y: auto; }
        
        .alert-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 0.8em; }

        /* SIMULATOR DRAWER */
        .sim-drawer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: var(--panel-bg); border: 2px solid var(--focus-orange); border-bottom: none; border-radius: 15px 15px 0 0; z-index: 9999; transition: transform 0.3s ease-in-out; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        .sim-drawer.collapsed { transform: translate(-50%, calc(100% - 40px)); }
        .sim-header { background: var(--focus-orange); color: #fff; padding: 10px 15px; cursor: pointer; border-radius: 12px 12px 0 0; font-weight: bold; display: flex; justify-content: space-between; align-items: center; height: 40px; }
        .sim-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .sim-body input { padding: 10px; background: #0b0f19; color: #fff; border: 1px solid #555; border-radius: 5px; }
        .sim-body button { padding: 12px; border: none; border-radius: 5px; color: white; background: var(--focus-orange); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo-container">
            <h1>FOCUS <span>HLS</span></h1>
            <div style="color: #666; font-size: 11px; margin-top: 5px; font-weight: bold;">COMMAND CENTER</div>
        </div>
        <div class="sidebar-content" id="roster">
            <h3 style="margin-top:0; font-size: 0.9em; color: #888;">ACTIVE SHIFTS</h3>
            <div class="guard-group">
                <div class="guard-header">
                    <span>Active Guards</span>
                </div>
                <div class="session-list" id="session-list">
                    </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="telemetry-row">
            <canvas id="telChart"></canvas>
            <div id="tel-overlay" style="position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: flex; align-items:center; justify-content:center; font-weight:bold; color:var(--cyber-blue); z-index:10;">AWAITING SESSION SELECTION</div>
        </div>

        <div class="dashboard-grid">
            <div style="display:flex; flex-direction: column; gap: 15px;">
                <div class="card" style="display: flex; justify-content: space-between; align-items: center; background: #000; border-color: var(--cyber-blue);">
                    <div>
                        <h2 id="focus-name" style="margin:0; color: var(--cyber-blue); font-size: 1.5em;">NO TARGET</h2>
                        <div id="focus-id" style="color: #666; font-size: 0.8em; font-family: monospace;">---</div>
                    </div>
                    <div id="focus-status" style="font-size: 1.2em; font-weight: bold; color: #555;">STANDBY</div>
                </div>

                <div class="card timeline-container" id="timeline">
                    <div style="text-align:center; color:#555; margin-top:20px;">Timeline will appear here</div>
                </div>

                <div class="card">
                    <h3 style="margin-top:0; font-size: 0.9em; color: #888; margin-bottom: 10px;">COMMAND OVERRIDES</h3>
                    <div class="alert-grid">
                        <button onclick="triggerTest('All Clear')" style="background: var(--cyber-blue); color: #000; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;">ALL CLEAR</button>
                        <button onclick="triggerTest('Acknowledge SOS')" style="background: var(--focus-orange); color: #000; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;">ACK SOS</button>
                        <button onclick="triggerTest('Evacuate')" style="background: var(--alert-red); color: #fff; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;">EVACUATE</button>
                        <button onclick="exportCSV()" style="background: #333; color: #fff; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;">EXPORT REPORT</button>
                    </div>
                </div>
            </div>

            <div class="card" style="display: flex; flex-direction: column;">
                <h3 style="margin-top:0; font-size: 0.9em; color: #888;">SHIFT DISTRIBUTION</h3>
                <div style="flex:1; position: relative; min-height: 200px;">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div id="sim-drawer" class="sim-drawer collapsed">
        <div class="sim-header" onclick="toggleSimDrawer()">
            <span>📱 Guard Simulator (Demo)</span>
            <span id="sim-toggle-icon">▲</span>
        </div>
        <div class="sim-body">
            <input type="text" id="sim-name" placeholder="Guard Name" value="Demo Guard (My Phone)">
            <button onclick="startSimulatedShift()" id="sim-start-btn">Start Demo Shift</button>
            
            <div class="sim-controls" id="sim-controls" style="display:none;">
                <p style="text-align: center; color: var(--cyber-blue); margin-top: 0;">Sensors Active! Move phone to test.</p>
                <div style="display: flex; gap: 10px;">
                    <button onclick="sendSimStatus('SOS / Medical')" style="background: var(--alert-red); flex: 1;">🔴 SOS</button>
                    <button onclick="sendSimStatus('Patrolling')" style="background: var(--cyber-blue); color: #000; flex: 1;">🔵 Normal</button>
                </div>
                <button onclick="stopSimulatedShift()" style="background: #333; margin-top: 10px;">End Demo</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // *** REPLACE WITH YOUR FIREBASE CONFIGURATION ***
        const firebaseConfig = {
            apiKey: "AIzaSyAB2OJTPCyJaZ0BpE-FAEKdPW143VE3YDo",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentSID = null;
        let activeSessions = {};
        let pieChart = null;
        let telChart = null;
        let stats = {};
        
        let gData = { ax: new Array(50).fill(0), ay: new Array(50).fill(0), az: new Array(50).fill(0) };
        let playbackQueue = [];

        // Chart Setup
        const ctxTel = document.getElementById('telChart').getContext('2d');
        telChart = new Chart(ctxTel, {
            type: 'line',
            data: {
                labels: new Array(50).fill(''),
                datasets: [
                    { label: 'X', data: gData.ax, borderColor: '#ff0055', borderWidth: 1, pointRadius: 0 },
                    { label: 'Y', data: gData.ay, borderColor: '#00ff00', borderWidth: 1, pointRadius: 0 },
                    { label: 'Z', data: gData.az, borderColor: '#00b4d8', borderWidth: 1, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: { y: { min: -20, max: 20, display: false }, x: { display: false } },
                plugins: { legend: { display: false } }
            }
        });

        // Listen for shifts
        onValue(ref(db, 'active_shifts'), (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('session-list');
            list.innerHTML = '';
            
            if(!data) {
                activeSessions = {};
                if(currentSID) deselectSession();
                return;
            }

            activeSessions = data;

            if(currentSID && !activeSessions[currentSID]) deselectSession();

            Object.keys(data).forEach(sid => {
                const s = data[sid];
                const div = document.createElement('div');
                div.className = 'session-item' + (currentSID === sid ? ' active' : '');
                
                let color = "#aaa";
                if(s.status && (s.status.includes('SOS') || s.status.includes('Down'))) color = "var(--alert-red)";
                else if(s.status && s.status.includes('Patrolling')) color = "var(--cyber-blue)";

                div.innerHTML = `
                    <div style="flex:1" onclick="selectSession('${sid}')">
                        <strong style="color:#fff">${s.name || 'Unknown'}</strong><br>
                        <span style="color:${color}">${s.status || 'Standby'}</span>
                    </div>
                    <button class="del-btn" onclick="deleteSession('${sid}', event)">X</button>
                `;
                list.appendChild(div);

                if(sid === currentSID) {
                    document.getElementById('focus-status').innerText = s.status || 'STANDBY';
                    if(s.status && (s.status.includes('SOS') || s.status.includes('Down'))) {
                        document.getElementById('focus-status').style.color = "var(--alert-red)";
                    } else {
                        document.getElementById('focus-status').style.color = "var(--cyber-blue)";
                    }

                    if(s.telemetry_batch && s.telemetry_batch.data) {
                        playbackQueue = playbackQueue.concat(s.telemetry_batch.data);
                    }

                    if(s.status && s.status !== window.lastStatus) {
                        window.lastStatus = s.status;
                        const timeStr = new Date().toLocaleTimeString();
                        const tl = document.getElementById('timeline');
                        if(tl.innerText === "Timeline will appear here") tl.innerHTML = '';
                        
                        let tagColor = "var(--cyber-blue)";
                        let textColor = "#000";
                        if(s.status.includes('SOS') || s.status.includes('Down')) { tagColor = "var(--alert-red)"; textColor="#fff"; }
                        if(s.status.includes('Sitting') || s.status.includes('Sleeping')) tagColor = "#f77f00";

                        tl.innerHTML = `
                            <div class="time-entry">
                                <span style="color:#888">${timeStr}</span>
                                <span class="status-tag" style="background:${tagColor}; color:${textColor}">${s.status}</span>
                            </div>
                        ` + tl.innerHTML;

                        if(!stats[s.status]) stats[s.status] = 0;
                        stats[s.status]++;
                        updatePie();
                    }
                }
            });
        });

        window.selectSession = (sid) => {
            currentSID = sid;
            const s = activeSessions[sid];
            document.getElementById('focus-name').innerText = s.name || 'Unknown Guard';
            document.getElementById('focus-id').innerText = sid;
            document.getElementById('tel-overlay').style.display = 'none';
            document.getElementById('timeline').innerHTML = '';
            stats = {};
            window.lastStatus = null;
            playbackQueue = [];
            
            // Re-trigger update manually for UI
            onValue(ref(db, 'active_shifts'), () => {}, {onlyOnce: true});
        };

        function deselectSession() {
            currentSID = null;
            document.getElementById('focus-name').innerText = 'NO TARGET';
            document.getElementById('focus-id').innerText = '---';
            document.getElementById('focus-status').innerText = 'STANDBY';
            document.getElementById('focus-status').style.color = '#555';
            document.getElementById('tel-overlay').style.display = 'flex';
            document.getElementById('timeline').innerHTML = '<div style="text-align:center; color:#555; margin-top:20px;">Timeline will appear here</div>';
            stats = {};
            if(pieChart) pieChart.destroy();
        }

        window.deleteSession = (sid, e) => {
            e.stopPropagation();
            if(confirm("Terminate this guard's session?")) {
                remove(ref(db, 'active_shifts/' + sid));
            }
        };

        function updatePie() {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if(pieChart) pieChart.destroy();
            pieChart = new Chart(ctx, { 
                type:'pie', 
                data:{ 
                    labels:Object.keys(stats), 
                    datasets:[{
                        data:Object.values(stats), 
                        backgroundColor:['#00b4d8','#f77f00','#d90429','#03045e','#00ff00','#9d4edd','#f9c74f']
                    }] 
                }, 
                options:{maintainAspectRatio:false, plugins: { legend: { position: 'right', labels: { color: '#ccc' } } }} 
            });
        }

        setInterval(() => {
            if(playbackQueue.length > 0) {
                const f = playbackQueue.shift();
                gData.ax.push(f.ax); gData.ax.shift();
                gData.ay.push(f.ay); gData.ay.shift();
                gData.az.push(f.az); gData.az.shift();
                if(telChart) telChart.update();
            }
        }, 20);

        window.triggerTest = (status) => {
            if(!currentSID) return alert("Select a session first");
            update(ref(db, `active_shifts/${currentSID}`), { status: status, timestamp: Date.now() });
        };

        window.exportCSV = () => {
            let csv = "Time,Status\n";
            stats && Object.keys(stats).forEach(k => csv += `${k},${stats[k]}\n`);
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'guard_report.csv');
            a.click();
        };

        // --- PRESENTATION SIMULATOR LOGIC ---
        window.simSessionID = null;
        window.simActive = false;
        window.simBuffer = [];
        window.simInterval = null;

        window.toggleSimDrawer = () => {
            const drawer = document.getElementById('sim-drawer');
            drawer.classList.toggle('collapsed');
            document.getElementById('sim-toggle-icon').innerText = drawer.classList.contains('collapsed') ? '▲' : '▼';
        };

        window.startSimulatedShift = async () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert("Motion sensor access denied. Cannot run demo.");
                        return;
                    }
                } catch(e) { console.error(e); }
            }

            const name = document.getElementById('sim-name').value || "Demo Guard";
            window.simSessionID = "demo_" + Date.now();
            window.simActive = true;
            
            set(ref(db, 'active_shifts/' + window.simSessionID), {
                id: window.simSessionID,
                name: name,
                status: 'Connecting...',
                start_time: Date.now(),
                telemetry_batch: null
            });

            document.getElementById('sim-start-btn').style.display = 'none';
            document.getElementById('sim-controls').style.display = 'block';

            window.addEventListener('devicemotion', window.handleSimMotion);
            
            window.simInterval = setInterval(() => {
                if(window.simActive && window.simBuffer.length > 0) {
                    const status = window.simResearchRecognition(window.simBuffer); 
                    update(ref(db, 'active_shifts/' + window.simSessionID), { 
                        telemetry_batch: { data: window.simBuffer, id: Date.now() }, 
                        status: status, 
                        timestamp: Date.now() 
                    });
                    window.simBuffer = [];
                }
            }, 1000);
        };

        window.stopSimulatedShift = () => {
            window.simActive = false;
            window.removeEventListener('devicemotion', window.handleSimMotion);
            clearInterval(window.simInterval);
            if(window.simSessionID) {
                remove(ref(db, 'active_shifts/' + window.simSessionID));
            }
            
            document.getElementById('sim-start-btn').style.display = 'block';
            document.getElementById('sim-controls').style.display = 'none';
        };

        window.handleSimMotion = (event) => {
            if(!window.simActive) return;
            const ax = event.accelerationIncludingGravity.x || 0;
            const ay = event.accelerationIncludingGravity.y || 0;
            const az = event.accelerationIncludingGravity.z || 0;
            window.simBuffer.push({ ax, ay, az, t: Date.now() });
        };

        window.sendSimStatus = (s) => {
            if(window.simSessionID) {
                update(ref(db, 'active_shifts/' + window.simSessionID), { status: s, isManual: true, timestamp: Date.now() });
            }
        };

        window.simResearchRecognition = (data) => {
            let magnitudes = data.map(f => Math.sqrt(f.ax**2 + f.ay**2 + f.az**2));
            let sma = magnitudes.reduce((a,b) => a + Math.abs(b - 9.81), 0) / magnitudes.length;
            let variance = magnitudes.reduce((a,b) => a + Math.pow(b - 9.81, 2), 0) / magnitudes.length;
            
            if (sma < 0.15 && variance < 0.02) return "Man Down / Immobility";
            if (sma < 0.25 && variance < 0.1) return "Sleeping / Inactive";
            if (sma < 0.4 && variance < 0.15) return "Sitting / Guarding";
            if (sma < 0.8 && variance < 0.4) return "Walking / Patrolling";
            return "Running / High Activity";
        };
    </script>
</body>
</html>
