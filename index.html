<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    // 1. Same exact config
    const firebaseConfig = {
      apiKey: "AIzaSyAB2OJTPCyJaZ0BpE-FAEKdPW143VE3YDo",
      authDomain: "focushls-live.firebaseapp.com",
      databaseURL: "https://focushls-live-default-rtdb.firebaseio.com",
      projectId: "focushls-live",
      storageBucket: "focushls-live.firebasestorage.app",
      messagingSenderId: "155686668050",
      appId: "1:155686668050:web:ec06db6910733f53bad5cb"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // 2. Listen to a specific guard (Change this to whatever name you type in the Guard app)
    const targetGuard = "Alex"; 
    
    // Update the UI header to show who we are watching
    document.querySelector('.header h1').innerText = `${targetGuard} - Live Feed`;

    const guardRef = ref(database, 'active_shifts/' + targetGuard);

    // 3. THE LISTENER: This fires automatically every time the Guard app pushes a change
    onValue(guardRef, (snapshot) => {
        const data = snapshot.val();
        
        if (data && data.status) {
            console.log("Manager received new status:", data.status);
            
            // Update the UI badge with the new status instantly
            document.querySelector('.status-badge').innerText = data.status;
            
            // If the status is an emergency, you could trigger an alert here
            if(data.status === "Emergency" || data.status === "Sleeping") {
                document.querySelector('.status-badge').style.backgroundColor = "var(--alert-red)";
            } else {
                document.querySelector('.status-badge').style.backgroundColor = "var(--focus-orange)";
            }
        }
    });

    // Note: The Chart.js logic from the previous file can stay here if you want to eventually
    // map "Walking" to chart movements, but the real-time status update is the core feature.
</script>
