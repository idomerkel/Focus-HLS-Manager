<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - FOCUS HLS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #050914;
            --panel-bg: #0b132b;
            --cyber-blue: #00d2ff;
            --focus-orange: #f07d00;
            --alert-red: #ff3366;
            --text-light: #e0eaf5;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; display: flex; height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: var(--panel-bg);
            border-right: 1px solid var(--cyber-blue);
            padding: 20px;
            overflow-y: auto;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--focus-orange); padding-bottom: 10px;
        }
        .guard-item {
            padding: 10px; margin-bottom: 10px;
            border: 1px solid var(--cyber-blue);
            border-radius: 5px; cursor: pointer;
            transition: 0.2s;
        }
        .guard-item:hover { background: rgba(0, 210, 255, 0.1); }
        .charts-container {
            display: flex; gap: 20px;
        }
        .chart-box {
            background: var(--panel-bg); padding: 15px;
            border-radius: 8px; border: 1px solid #1a2950;
            flex: 1;
        }
        .alerts-panel {
            background: var(--panel-bg); padding: 15px; border-radius: 8px;
            border: 1px solid #1a2950;
        }
        .checkbox-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
        }
        .status-badge {
            background: var(--focus-orange); color: white;
            padding: 5px 10px; border-radius: 15px; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color: var(--cyber-blue);">FOCUS HLS</h2>
    <p>Active Shifts</p>
    <div class="guard-item">
        <strong>Alex R.</strong> <span class="status-badge">Walking</span><br>
        <small>North Mall Entrance</small>
    </div>
</div>

<div class="main-content">
    <div class="header">
        <div>
            <h1 style="margin: 0;">Alex R. - Live Feed</h1>
            <span style="color: var(--cyber-blue);">Shift Duration: 04:15:22</span>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-box" style="flex: 2;">
            <h3 style="margin-top: 0;">Live Movement Stream (Z-Axis)</h3>
            <canvas id="lineChart"></canvas>
        </div>
        
        <div class="chart-box" style="flex: 1;">
            <h3 style="margin-top: 0;">Shift Activity Breakdown</h3>
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="alerts-panel">
        <h3>Manager Alerts Configuration</h3>
        <div class="checkbox-grid">
            <label><input type="checkbox" checked> Walking</label>
            <label><input type="checkbox"> Driving</label>
            <label><input type="checkbox"> Sitting</label>
            <label><input type="checkbox"> Talking</label>
            <label><input type="checkbox" checked> Elevator</label>
            <label style="color: var(--alert-red); font-weight: bold;"><input type="checkbox" checked> Sleeping</label>
            <label style="color: var(--alert-red); font-weight: bold;"><input type="checkbox" checked> Emergency</label>
        </div>
    </div>
</div>

<script>
    // Set up Chart.js global defaults for the dark theme
    Chart.defaults.color = '#e0eaf5';
    Chart.defaults.borderColor = '#1a2950';

    // --- Line Chart Setup (Simulating Live Data) ---
    const ctxLine = document.getElementById('lineChart').getContext('2d');
    const lineChart = new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: Array.from({length: 20}, (_, i) => i),
            datasets: [{
                label: 'Z-Axis Force',
                data: Array(20).fill(0),
                borderColor: '#00d2ff',
                backgroundColor: 'rgba(0, 210, 255, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            animation: false, // Turn off animation for smoother live data feel
            scales: { y: { suggestedMin: -15, suggestedMax: 15 } }
        }
    });

    // --- Pie Chart Setup ---
    const ctxPie = document.getElementById('pieChart').getContext('2d');
    const pieChart = new Chart(ctxPie, {
        type: 'doughnut',
        data: {
            labels: ['Walking', 'Sitting', 'Standing', 'Elevator'],
            datasets: [{
                data: [45, 25, 20, 10],
                backgroundColor: ['#00d2ff', '#f07d00', '#1a2950', '#ffffff'],
                borderWidth: 0
            }]
        }
    });

    // --- Simulation Logic ---
    // TODO: Replace this simulation with real incoming data from your Server/Firebase
    setInterval(() => {
        // Generate a random number to simulate a footstep/movement
        const newMovement = (Math.random() * 20) - 10; 
        
        const dataArray = lineChart.data.datasets[0].data;
        dataArray.push(newMovement); // Add new data point
        dataArray.shift();           // Remove oldest data point
        
        lineChart.update();
    }, 500); // Update every 500ms
</script>

</body>
</html>
