<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus HLS - Manager Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --cyber-blue: #00b4d8; --cyber-dark: #03045e; --dark-bg: #0b0f19;
            --panel-bg: #1a2235; --text-light: #caf0f8; --alert-red: #d90429; --focus-orange: #f77f00;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--dark-bg); color: var(--text-light); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background-color: var(--panel-bg); border-right: 2px solid var(--cyber-blue); padding: 20px; overflow-y: auto; }
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; overflow-y: auto; }
        h2 { color: var(--cyber-blue); margin-top: 0; border-bottom: 1px solid var(--cyber-dark); padding-bottom: 10px; }
        
        /* Guard List Styles */
        .guard-item { background: rgba(0,0,0,0.3); padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--cyber-blue); cursor: pointer; transition: 0.3s; }
        .guard-item:hover { background: rgba(0, 180, 216, 0.2); }
        .guard-name { font-weight: bold; font-size: 1.1em; color: white; }
        .guard-loc { font-size: 0.85em; color: #888; }
        
        /* Dashboard Styles */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background-color: var(--panel-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--cyber-dark); }
        .status-badge { display: inline-block; padding: 10px 20px; background-color: var(--focus-orange); color: white; border-radius: 5px; font-weight: bold; font-size: 1.2em; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9em; }
        .info-grid span { color: var(--cyber-blue); }
        
        /* Checkbox List */
        .checkbox-list label { display: block; margin-bottom: 8px; cursor: pointer; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Active Forces</h2>
        <div id="guard-list">Waiting for telemetry...</div>
    </div>

    <div class="main-content" id="dashboard" style="display: none;">
        <h2 id="dash-title">Guard Dashboard</h2>
        
        <div class="card" style="margin-bottom: 20px;">
            <h3>Live Telemetry Status</h3>
            <div class="status-badge" id="live-status">Offline</div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Operative Details</h3>
                <div class="info-grid" id="guard-info">
                    </div>
            </div>

            <div class="card">
                <h3>Shift Movement Analysis</h3>
                <canvas id="movementChart"></canvas>
            </div>
            
            <div class="card" style="grid-column: span 2;">
                <h3>Alert Triggers (AI Recognition)</h3>
                <div class="checkbox-list">
                    <label><input type="checkbox" checked> Emergency Triggered</label>
                    <label><input type="checkbox" checked> Sleeping on Duty</label>
                    <label><input type="checkbox"> Driving</label>
                    <label><input type="checkbox"> Talking / Idle</label>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAB2OJTPCyJaZ0BpE-FAEKdPW143VE3YDo",
            authDomain: "focushls-live.firebaseapp.com",
            databaseURL: "https://focushls-live-default-rtdb.firebaseio.com",
            projectId: "focushls-live",
            storageBucket: "focushls-live.firebasestorage.app",
            messagingSenderId: "155686668050",
            appId: "1:155686668050:web:ec06db6910733f53bad5cb"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const shiftsRef = ref(database, 'active_shifts');
        
        let chartInstance = null;
        let globalData = {};

        // Listen for ANY changes in active_shifts
        onValue(shiftsRef, (snapshot) => {
            globalData = snapshot.val() || {};
            renderSidebar(globalData);
            
            // If viewing a specific guard, update their live status
            const activeTitle = document.getElementById('dash-title').innerText;
            if(activeTitle !== "Guard Dashboard" && globalData[activeTitle]) {
                updateDashboard(activeTitle);
            }
        });

        function renderSidebar(data) {
            const listDiv = document.getElementById('guard-list');
            listDiv.innerHTML = ''; // Clear list
            
            for (const [guardName, guardData] of Object.entries(data)) {
                const loc = guardData.info ? guardData.info.location : "Unknown Location";
                const item = document.createElement('div');
                item.className = 'guard-item';
                item.innerHTML = `<div class="guard-name">${guardName}</div><div class="guard-loc">${loc}</div>`;
                item.onclick = () => selectGuard(guardName);
                listDiv.appendChild(item);
            }
        }

        window.selectGuard = function(guardName) {
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('dash-title').innerText = guardName;
            updateDashboard(guardName);
            renderChart();
        }

        function updateDashboard(guardName) {
            const data = globalData[guardName];
            if(!data) return;

            // Update Status Badge
            const badge = document.getElementById('live-status');
            badge.innerText = data.status || "Unknown";
            badge.style.backgroundColor = (data.status === "Emergency" || data.status === "Sleeping") ? "var(--alert-red)" : "var(--focus-orange)";

            // Update Info Grid
            const info = data.info || {};
            document.getElementById('guard-info').innerHTML = `
                <div><span>Age:</span> ${info.age || 'N/A'}</div>
                <div><span>Tag:</span> ${info.tag || 'N/A'}</div>
                <div><span>Blood Type:</span> ${info.bloodType || 'N/A'}</div>
                <div><span>Emergency Contact:</span> ${info.emergencyContact || 'N/A'}</div>
            `;
        }

        function renderChart() {
            const ctx = document.getElementById('movementChart').getContext('2d');
            
            if(chartInstance) { chartInstance.destroy(); }
            
            // Placeholder data for the cake diagram
            chartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Walking', 'Sitting', 'Patrol', 'Elevator', 'Stairs'],
                    datasets: [{
                        data: [45, 20, 25, 5, 5],
                        backgroundColor: ['#00b4d8', '#03045e', '#f77f00', '#d90429', '#0077b6'],
                        borderWidth: 1, borderColor: '#0b0f19'
                    }]
                },
                options: { plugins: { legend: { position: 'right', labels: { color: '#caf0f8' } } } }
            });
        }
    </script>
</body>
</html>
