<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus HLS - Manager Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --cyber-blue: #00b4d8; --cyber-dark: #03045e; --dark-bg: #0b0f19; --panel-bg: #1a2235; --text-light: #caf0f8; --alert-red: #d90429; --focus-orange: #f77f00; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--dark-bg); color: var(--text-light); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background-color: var(--panel-bg); border-right: 2px solid var(--cyber-blue); padding: 20px; overflow-y: auto; }
        .guard-item { background: rgba(0,0,0,0.3); padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--cyber-blue); cursor: pointer; transition: 0.3s; }
        .guard-item:hover { background: rgba(0, 180, 216, 0.2); }
        .guard-name { font-weight: bold; font-size: 1.1em; color: white; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        h2 { color: var(--cyber-blue); margin-top: 0; border-bottom: 1px solid var(--cyber-dark); padding-bottom: 10px; }
        .card { background-color: var(--panel-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--cyber-dark); margin-bottom: 15px; }
        .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .telemetry-section { margin-bottom: 10px; }
        .telemetry-title { font-size: 0.8em; color: var(--text-light); margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .telemetry-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .t-box { background: black; padding: 8px; border-radius: 4px; border: 1px solid var(--cyber-blue); font-family: monospace; color: #00ff00; text-align: center; font-size: 1.2em; }
        .t-label { color: #888; font-size: 0.6em; display: block; }
        .timeline { max-height: 180px; overflow-y: auto; border-left: 2px solid var(--cyber-blue); margin-left: 10px; padding-left: 15px; }
        .time-item { margin-bottom: 10px; font-size: 0.95em; position: relative; }
        .time-item::before { content: ''; position: absolute; left: -21px; top: 4px; width: 10px; height: 10px; background: var(--focus-orange); border-radius: 50%; }
        .time-stamp { color: #888; font-size: 0.85em; margin-right: 10px; }
        .tag { background: rgba(0, 180, 216, 0.2); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--cyber-blue); color: white; }
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        canvas { max-height: 250px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Active Forces</h2>
        <div id="guard-list">Waiting for telemetry...</div>
    </div>

    <div class="main-content" id="dashboard" style="display: none;">
        <h2 id="dash-title">Guard Dashboard</h2>
        
        <div class="top-row">
            <div class="card">
                <h3 style="margin-top: 0; margin-bottom: 15px;">100Hz Buffered Telemetry</h3>
                
                <div class="telemetry-section">
                    <div class="telemetry-title">Accelerometer (m/s²)</div>
                    <div class="telemetry-grid">
                        <div class="t-box"><span class="t-label">X-AXIS</span><span id="ax">0.00</span></div>
                        <div class="t-box"><span class="t-label">Y-AXIS</span><span id="ay">0.00</span></div>
                        <div class="t-box"><span class="t-label">Z-AXIS</span><span id="az">0.00</span></div>
                    </div>
                </div>

                <div class="telemetry-section">
                    <div class="telemetry-title">Gyroscope (deg/s)</div>
                    <div class="telemetry-grid">
                        <div class="t-box"><span class="t-label">PITCH</span><span id="gx">0.0</span></div>
                        <div class="t-box"><span class="t-label">ROLL</span><span id="gy">0.0</span></div>
                        <div class="t-box"><span class="t-label">YAW</span><span id="gz">0.0</span></div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h3 style="margin-top: 0;">Movement Status Timeline</h3>
                <div class="timeline" id="timeline-container"></div>
            </div>
        </div>

        <div class="bottom-grid">
            <div class="card">
                <h3 style="margin-top: 0;">Shift Analysis Diagram</h3>
                <canvas id="movementChart"></canvas>
            </div>
            
            <div class="card">
                <h3 style="margin-top: 0;">Alert Notification Triggers</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label><input type="checkbox" checked> Emergency Status</label>
                    <label><input type="checkbox" checked> Sleeping</label>
                    <label><input type="checkbox"> Driving</label>
                    <label><input type="checkbox"> Idle / Sitting</label>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAB2OJTPCyJaZ0BpE-FAEKdPW143VE3YDo",
            authDomain: "focushls-live.firebaseapp.com",
            databaseURL: "https://focushls-live-default-rtdb.firebaseio.com",
            projectId: "focushls-live",
            storageBucket: "focushls-live.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        let chartInstance = null;
        let globalData = {};
        let currentViewedGuard = null;
        let lastKnownStatus = "";
        let statusCounts = {};

        // PLAYBACK ENGINE VARIABLES
        let playbackQueue = [];
        let playbackInterval = null;

        // Listen for ANY changes
        onValue(ref(database, 'active_shifts'), (snapshot) => {
            globalData = snapshot.val() || {};
            renderSidebar();
            if(currentViewedGuard && globalData[currentViewedGuard]) {
                processGuardUpdate(globalData[currentViewedGuard]);
            }
        });

        function renderSidebar() {
            const listDiv = document.getElementById('guard-list');
            listDiv.innerHTML = ''; 
            for (const [guardName, guardData] of Object.entries(globalData)) {
                const loc = guardData.info ? guardData.info.location : "Unknown Location";
                const item = document.createElement('div');
                item.className = 'guard-item';
                item.innerHTML = `<div class="guard-name">${guardName}</div><div style="font-size:0.85em; color:#888;">${loc}</div>`;
                item.onclick = () => selectGuard(guardName);
                listDiv.appendChild(item);
            }
        }

        window.selectGuard = function(guardName) {
            currentViewedGuard = guardName;
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('dash-title').innerText = `${guardName} - Live Telemetry`;
            
            document.getElementById('timeline-container').innerHTML = '';
            lastKnownStatus = "";
            statusCounts = {};
            playbackQueue = []; // Clear queue when switching guards
            
            startPlaybackLoop();
            processGuardUpdate(globalData[guardName]);
        }

        function processGuardUpdate(data) {
            if(!data) return;

            // 1. Add new batch of 300 frames (3 seconds) to our playback queue
            if(data.batched_telemetry) {
                playbackQueue = playbackQueue.concat(data.batched_telemetry);
                // Expand memory cap to 900 (9 seconds of buffer) to account for 3-second network delays
                if(playbackQueue.length > 900) playbackQueue = playbackQueue.slice(-900);
            }

            // 2. Update Timeline & Chart
            if(data.status && data.status !== lastKnownStatus && data.status !== "Offline") {
                lastKnownStatus = data.status;
                const timeStr = new Date().toLocaleTimeString();
                const timelineHtml = `<div class="time-item"><span class="time-stamp">${timeStr}</span> <span class="tag">${data.status}</span></div>`;
                document.getElementById('timeline-container').insertAdjacentHTML('afterbegin', timelineHtml);

                statusCounts[data.status] = (statusCounts[data.status] || 0) + 1;
                renderChart();
            }
        }

        // PLAYBACK ENGINE: Renders frames locally at high speed
        function startPlaybackLoop() {
            if(playbackInterval) clearInterval(playbackInterval);
            
            playbackInterval = setInterval(() => {
                if(playbackQueue.length > 0) {
                    // Pull the oldest frame from the queue
                    const frame = playbackQueue.shift();
                    
                    document.getElementById('ax').innerText = frame.ax;
                    document.getElementById('ay').innerText = frame.ay;
                    document.getElementById('az').innerText = frame.az;
                    document.getElementById('gx').innerText = frame.gx;
                    document.getElementById('gy').innerText = frame.gy;
                    document.getElementById('gz').innerText = frame.gz;
                }
            }, 10); // Playback at 10ms intervals (100Hz)
        }

        function renderChart() {
            const ctx = document.getElementById('movementChart').getContext('2d');
            if(chartInstance) chartInstance.destroy(); 
            
            const labels = Object.keys(statusCounts);
            const dataValues = Object.values(statusCounts);

            chartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels.length ? labels : ['No Data'],
                    datasets: [{
                        data: dataValues.length ? dataValues : [1],
                        backgroundColor: ['#00b4d8', '#f77f00', '#d90429', '#03045e', '#0077b6', '#48cae4'],
                        borderWidth: 1, borderColor: '#0b0f19'
                    }]
                },
                options: { animation: { duration: 500 }, plugins: { legend: { position: 'right', labels: { color: '#caf0f8' } } } }
            });
        }
    </script>
</body>
</html>
