<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus HLS - Manager Dashboard</title>
    <style>
        :root {
            --cyber-blue: #00b4d8;
            --dark-bg: #0b0f19;
            --panel-bg: #1a2235;
            --text-light: #caf0f8;
            --alert-red: #d90429;
            --focus-orange: #f77f00;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }
        .header {
            border-bottom: 2px solid var(--cyber-blue);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .dashboard-card {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--cyber-blue);
            max-width: 600px;
        }
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--focus-orange);
            color: white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Waiting for Guard...</h1>
    </div>

    <div class="dashboard-card">
        <h3>Current Gyro Status</h3>
        <div class="status-badge">Offline</div>
        <p style="color: #666; font-size: 0.9em; margin-top: 15px;">Waiting for real-time Firebase stream...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAB2OJTPCyJaZ0BpE-FAEKdPW143VE3YDo",
            authDomain: "focushls-live.firebaseapp.com",
            databaseURL: "https://focushls-live-default-rtdb.firebaseio.com",
            projectId: "focushls-live",
            storageBucket: "focushls-live.firebasestorage.app",
            messagingSenderId: "155686668050",
            appId: "1:155686668050:web:ec06db6910733f53bad5cb"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Listen to a specific guard
        const targetGuard = "Alex";
        
        // Update the UI header to show who we are watching
        document.querySelector('.header h1').innerText = `${targetGuard} - Live Feed`;
        
        const guardRef = ref(database, 'active_shifts/' + targetGuard);

        // This fires automatically every time the Guard app pushes a change
        onValue(guardRef, (snapshot) => {
            const data = snapshot.val();
            
            if (data && data.status) {
                console.log("Manager received new status:", data.status);
                
                const badge = document.querySelector('.status-badge');
                badge.innerText = data.status;
                
                if(data.status === "Emergency" || data.status === "Sleeping") {
                    badge.style.backgroundColor = "var(--alert-red)";
                } else {
                    badge.style.backgroundColor = "var(--focus-orange)";
                }
            }
        });
    </script>
</body>
</html>
